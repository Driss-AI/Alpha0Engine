name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff mypy
      - run: ruff check services/ shared/
      - run: mypy services/ shared/ --ignore-missing-imports --no-strict-optional
      # S11.6: cheap structural guards — byte-compile everything (catches syntax
      # errors in workers CI doesn't otherwise import) and walk the full pipeline
      # plan without executing it (catches an orphaned/renamed step).
      - name: Byte-compile all sources
        run: python -m compileall -q shared services scripts
      - name: Pipeline dry-run
        run: python scripts/run_daily_pipeline.py --dry-run

  test-workers:
    name: Test Workers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - name: Run worker test suites (sqlite)
        env:
          DATABASE_URL: sqlite+aiosqlite://
        run: |
          set -e
          for d in services/*/tests; do
            svc=$(dirname "$d")
            [ "$svc" = "services/api" ] && continue
            echo "== $svc"
            (cd "$svc" && python -m pytest tests/ -q --tb=short)
          done
      - name: Pipeline orchestrator tests
        env:
          DATABASE_URL: sqlite+aiosqlite://
        run: python -m pytest scripts/tests/ -q --tb=short

      - name: Catch-rate scoreboard (must be clean)
        run: python scripts/catch_rate.py

  test-api:
    name: Test API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: alpha_engine_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest pytest-asyncio httpx
      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/alpha_engine_test
          API_SECRET_KEY: test-secret
          ENVIRONMENT: test
        run: pytest services/api/tests/ -v --tb=short
