version: "3.9"

# ----------------------------------------------------------------------------
# Alpha0Engine — local development compose (post-restructure)
# ----------------------------------------------------------------------------
# Two app services, one image (see Dockerfile):
#   api      — FastAPI gateway + dashboard
#   pipeline — the full daily pipeline (scripts/run_daily_pipeline.py), run
#              on-demand locally:  docker compose run --rm pipeline
# On Railway: same image, two services; `pipeline` runs on daily cron.
# ----------------------------------------------------------------------------

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: alpha_engine
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/alpha_engine
      ENVIRONMENT: development
    depends_on:
      postgres: {condition: service_healthy}
    command: sh -c "alembic upgrade head && uvicorn services.api.main:app --host 0.0.0.0 --port 8000 --reload"
    restart: unless-stopped

  pipeline:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/alpha_engine
      ENVIRONMENT: development
      RUN_MODE: once
    depends_on:
      postgres: {condition: service_healthy}
    command: python scripts/run_daily_pipeline.py
    profiles: ["pipeline"]   # opt-in: docker compose run --rm pipeline

volumes:
  postgres_data:
